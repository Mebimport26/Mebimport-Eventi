<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-in Evento</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #18181f;
    --border: #2a2a38;
    --accent: #c8f060;
    --accent-dim: #8aaa30;
    --red: #ff4757;
    --gold: #f5c842;
    --text: #f0f0f5;
    --muted: #6b6b80;
    --success-bg: #0d1f0a;
    --error-bg: #1f0a0a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0; opacity: 0.5;
  }

  header {
    position: relative; z-index: 10;
    padding: 20px 32px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .logo { font-family: 'DM Serif Display', serif; font-size: 22px; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .event-badge {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 6px 14px;
    font-size: 12px; color: var(--muted); font-family: 'DM Mono', monospace;
  }
  .counter-pill {
    background: var(--accent); color: #0a0a0f;
    border-radius: 20px; padding: 6px 14px;
    font-size: 12px; font-weight: 600; font-family: 'DM Mono', monospace;
  }

  main {
    position: relative; z-index: 1;
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 420px;
    gap: 0;
    max-height: calc(100vh - 73px);
  }

  .scanner-panel {
    padding: 40px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px;
    border-right: 1px solid var(--border);
  }
  .scanner-label {
    font-family: 'DM Mono', monospace; font-size: 11px;
    text-transform: uppercase; letter-spacing: 2px; color: var(--muted);
  }
  .scanner-frame { position: relative; width: 280px; height: 280px; }
  .scanner-frame::before, .scanner-frame::after,
  .scanner-frame .corner-tl, .scanner-frame .corner-br {
    content: ''; position: absolute; width: 28px; height: 28px;
    border-color: var(--accent); border-style: solid;
  }
  .scanner-frame::before { top: 0; left: 0; border-width: 3px 0 0 3px; }
  .scanner-frame::after  { top: 0; right: 0; border-width: 3px 3px 0 0; }
  .scanner-frame .corner-tl { bottom: 0; left: 0; border-width: 0 0 3px 3px; }
  .scanner-frame .corner-br { bottom: 0; right: 0; border-width: 0 3px 3px 0; }
  #qr-reader { width: 280px !important; height: 280px !important; overflow: hidden; border-radius: 4px; }
  #qr-reader video { border-radius: 4px; }
  #qr-reader img { display: none !important; }
  #qr-reader__dashboard { display: none !important; }

  .scan-line {
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: scan 2.5s ease-in-out infinite;
    box-shadow: 0 0 12px var(--accent);
  }
  @keyframes scan {
    0%   { top: 0; } 50% { top: 278px; } 100% { top: 0; }
  }

  .divider {
    display: flex; align-items: center; gap: 12px;
    width: 100%; max-width: 280px;
    color: var(--muted); font-size: 11px;
    font-family: 'DM Mono', monospace;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .manual-input-row { display: flex; gap: 8px; width: 100%; max-width: 280px; }
  .manual-input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; color: var(--text);
    font-family: 'DM Mono', monospace; font-size: 13px; outline: none;
    transition: border-color 0.2s;
  }
  .manual-input:focus { border-color: var(--accent); }
  .manual-input::placeholder { color: var(--muted); }
  .btn-search {
    background: var(--accent); color: #0a0a0f; border: none;
    border-radius: 8px; padding: 10px 16px; font-weight: 600;
    font-size: 13px; cursor: pointer; transition: opacity 0.2s; white-space: nowrap;
  }
  .btn-search:hover { opacity: 0.85; }

  /* INFO PANEL */
  .info-panel { display: flex; flex-direction: column; background: var(--surface); overflow-y: auto; }

  .empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px; text-align: center; gap: 12px;
  }
  .empty-icon { font-size: 48px; opacity: 0.3; margin-bottom: 8px; }
  .empty-state h3 { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--muted); font-weight: 400; }
  .empty-state p { color: var(--muted); font-size: 13px; line-height: 1.6; max-width: 220px; }

  .guest-card { display: none; flex-direction: column; height: 100%; }
  .guest-card.visible { display: flex; }

  .guest-header { padding: 32px 32px 0; }
  .guest-status-tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 20px;
    font-size: 11px; font-weight: 600;
    font-family: 'DM Mono', monospace;
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px;
  }
  .tag-waiting { background: #1a1a08; border: 1px solid #4a4a20; color: var(--gold); }
  .tag-done    { background: var(--success-bg); border: 1px solid #2a4a20; color: var(--accent); }
  .tag-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .guest-name {
    font-family: 'DM Serif Display', serif; font-size: 36px;
    line-height: 1.1; letter-spacing: -1px; margin-bottom: 4px;
  }
  .guest-id { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); }

  .guest-details { padding: 24px 32px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .detail-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; background: var(--surface2);
    border-radius: 10px; border: 1px solid var(--border);
  }
  .detail-icon { font-size: 16px; width: 20px; text-align: center; }
  .detail-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; font-family: 'DM Mono', monospace; }
  .detail-value { font-size: 14px; color: var(--text); font-weight: 500; margin-top: 2px; }

  .confirm-area { padding: 24px 32px 32px; border-top: 1px solid var(--border); }
  .btn-checkin {
    width: 100%; padding: 18px;
    background: var(--accent); color: #0a0a0f; border: none;
    border-radius: 12px; font-family: 'DM Sans', sans-serif;
    font-size: 16px; font-weight: 700; cursor: pointer;
    transition: all 0.2s; letter-spacing: -0.3px;
  }
  .btn-checkin:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(200,240,96,0.25); }
  .btn-checkin:active { transform: translateY(0); }
  .btn-checkin:disabled {
    background: var(--surface2); color: var(--muted); cursor: default;
    transform: none; box-shadow: none; border: 1px solid var(--border);
  }
  .btn-checkin.done-state {
    background: var(--success-bg); color: var(--accent);
    border: 1px solid var(--accent-dim); cursor: default; font-size: 14px;
  }

  .toast {
    position: fixed; bottom: 32px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    padding: 14px 24px; border-radius: 40px;
    font-size: 14px; font-weight: 500; z-index: 999;
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
    opacity: 0; display: flex; align-items: center; gap: 10px;
    backdrop-filter: blur(12px);
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.success { background: #1a3a10; border: 1px solid var(--accent-dim); color: var(--accent); }
  .toast.error   { background: var(--error-bg); border: 1px solid #5a1a1a; color: var(--red); }

  @keyframes pulse-success {
    0%   { box-shadow: 0 0 0 0 rgba(200,240,96,0.4); }
    70%  { box-shadow: 0 0 0 20px rgba(200,240,96,0); }
    100% { box-shadow: 0 0 0 0 rgba(200,240,96,0); }
  }
  .pulse { animation: pulse-success 0.6s ease-out; }

  .recent-log { border-top: 1px solid var(--border); padding: 16px 32px; background: var(--bg); display: none; }
  .recent-log.has-items { display: block; }
  .log-title { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-family: 'DM Mono', monospace; margin-bottom: 10px; }
  .log-list { display: flex; flex-direction: column; gap: 6px; max-height: 130px; overflow-y: auto; }
  .log-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; background: var(--surface2);
    border-radius: 8px; font-size: 12px; border-left: 3px solid var(--accent);
  }
  .log-item .log-name { font-weight: 500; }
  .log-item .log-time { color: var(--muted); font-family: 'DM Mono', monospace; font-size: 11px; }

  @media (max-width: 768px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .scanner-panel { padding: 24px; border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>

<header>
  <div class="logo">check<span>·</span>in</div>
  <div class="event-badge">AGRO.GE.PA.CIOK 2026</div>
  <div class="counter-pill" id="counter">0 ingressi</div>
</header>

<main>
  <!-- SCANNER -->
  <div class="scanner-panel">
    <div class="scanner-label">Inquadra il QR dell'ospite</div>
    <div class="scanner-frame">
      <div id="qr-reader"></div>
      <div class="scan-line"></div>
      <div class="corner-tl"></div>
      <div class="corner-br"></div>
    </div>
    <div class="divider">oppure inserisci manuale</div>
    <div class="manual-input-row">
      <input type="text" class="manual-input" id="manual-id" placeholder="MEB-261027-1415 o telefono" autocomplete="off">
      <button class="btn-search" onclick="handleScan(document.getElementById('manual-id').value.trim())">Cerca →</button>
    </div>
  </div>

  <!-- INFO PANEL -->
  <div class="info-panel">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">🎟️</div>
      <h3>In attesa di scansione</h3>
      <p>Inquadra il QR del biglietto o inserisci ID / telefono per il check-in.</p>
    </div>

    <div class="guest-card" id="guest-card">
      <div class="guest-header">
        <div class="guest-status-tag tag-waiting" id="status-tag">
          <span class="tag-dot"></span>
          <span id="status-label">In attesa</span>
        </div>
        <div class="guest-name" id="guest-name">—</div>
        <div class="guest-id" id="guest-id">—</div>
      </div>

      <div class="guest-details">
        <div class="detail-row">
          <div class="detail-icon">📱</div>
          <div class="detail-content">
            <div class="detail-label">Telefono</div>
            <div class="detail-value" id="detail-phone">—</div>
          </div>
        </div>
        <div class="detail-row">
          <div class="detail-icon">🏢</div>
          <div class="detail-content">
            <div class="detail-label">P.IVA</div>
            <div class="detail-value" id="detail-piva">—</div>
          </div>
        </div>
        <div class="detail-row">
          <div class="detail-icon">🕐</div>
          <div class="detail-content">
            <div class="detail-label">Confermato il</div>
            <div class="detail-value" id="detail-date">—</div>
          </div>
        </div>
        <div class="detail-row" id="checkin-time-row" style="display:none;">
          <div class="detail-icon">✅</div>
          <div class="detail-content">
            <div class="detail-label">Check-in effettuato alle</div>
            <div class="detail-value" id="detail-checkin-time">—</div>
          </div>
        </div>
      </div>

      <div class="confirm-area">
        <button class="btn-checkin" id="btn-checkin" onclick="doCheckIn()">
          ✓ Conferma ingresso
        </button>
      </div>

      <div class="recent-log" id="recent-log">
        <div class="log-title">Ultimi check-in</div>
        <div class="log-list" id="log-list"></div>
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  // ─── CONFIGURAZIONE ───────────────────────────────────────────────
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx8ptKFQZO-H04-7cSTeZETELl8O2AJl7I6r6WpDS0NkajuR1KLIPntcoOtwyhic0wo3w/exec';
  const TOKEN = '';        // deve coincidere con TOKEN nello Apps Script (se lo usi)
  const DEMO_MODE = false; // true SOLO per provare l'interfaccia senza backend
  // ─────────────────────────────────────────────────────────────────

  let currentGuest = null;
  let checkinCount = 0;
  let recentLog = [];
  let lastScanned = null;
  let scanCooldown = false;
  let busy = false;

  // ─── PARSER DEL QR ───────────────────────────────────────────────
  // Payload atteso (testo multilinea):
  //   ID: MEB-261027-1415
  //   Nome: Renna
  //   Tel: 3929930154
  //   P.IVA: 00000000000
  // Accetta anche input manuale: un ID (MEB-...) oppure un numero di telefono.
  function parsePayload(raw) {
    raw = String(raw || '').trim();
    const get = (label) => {
      const m = raw.match(new RegExp('^\\s*' + label + '\\s*:\\s*(.+?)\\s*$', 'im'));
      return m ? m[1].trim() : '';
    };
    const id = get('ID');
    const nome = get('Nome');
    const tel = get('Tel');
    const piva = get('P\\.?\\s*IVA');
    if (id || tel) return { id: id.toUpperCase(), nome, tel, piva };

    // Input manuale
    if (/^MEB-/i.test(raw)) return { id: raw.toUpperCase(), nome: '', tel: '', piva: '' };
    return { id: '', nome: '', tel: raw, piva: '' };
  }

  function errMsg(e) {
    console.error(e);
    if (e && e.name === 'TypeError') return 'Script non raggiungibile: controlla APPS_SCRIPT_URL e l\'accesso "Chiunque" del deploy';
    if (e && /^HTTP /.test(e.message)) return 'Risposta del server non valida (' + e.message + '): URL del deploy errato?';
    if (e && e.name === 'SyntaxError') return 'Lo script non ha risposto in JSON: URL errato o deploy non pubblico';
    return 'Errore script: ' + (e && e.message ? e.message : e);
  }

  // ─── API ─────────────────────────────────────────────────────────
  async function api(params) {
    const qs = new URLSearchParams(Object.assign({}, params, { token: TOKEN }));
    const res = await fetch(APPS_SCRIPT_URL + '?' + qs.toString());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    return data;
  }

  // ─── QR SCANNER ──────────────────────────────────────────────────
  const html5QrCode = new Html5Qrcode("qr-reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 240, height: 240 } },
    (decodedText) => {
      if (scanCooldown || decodedText === lastScanned) return;
      lastScanned = decodedText;
      scanCooldown = true;
      setTimeout(() => { scanCooldown = false; lastScanned = null; }, 3000);
      handleScan(decodedText);
    },
    () => {}
  ).catch(() => {
    showToast('Fotocamera non disponibile: usa l\'inserimento manuale', 'error');
  });

  // ─── HANDLE SCAN ─────────────────────────────────────────────────
  async function handleScan(raw) {
    if (!raw || busy) return;
    const p = parsePayload(raw);
    const digits = p.tel.replace(/\D/g, '');
    if (!p.id && digits.length < 8) {
      showToast('Codice non valido. Riprova.', 'error');
      return;
    }

    busy = true;
    showToast('🔍 Ricerca in corso…', 'success');
    try {
      const data = await api({ action: 'lookup', id: p.id, phone: p.tel });
      if (!data.found) {
        showToast('❌ Ospite non trovato nel registro', 'error');
        showNotFound(p);
        return;
      }
      renderGuest(data);
    } catch (e) {
      if (DEMO_MODE) {
        renderGuest({ found: true, id: p.id || 'MEB-DEMO', nome: p.nome || 'Ospite demo',
          telefono: p.tel, piva: p.piva, dataConferma: '—', stato: 'In attesa', checkinTime: null });
      } else {
        showToast('⚠️ ' + errMsg(e), 'error');
      }
    } finally {
      busy = false;
    }
  }

  // ─── OSPITE NON TROVATO ──────────────────────────────────────────
  function showNotFound(p) {
    currentGuest = null;
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('guest-card').classList.add('visible');

    document.getElementById('guest-name').textContent = p.nome || 'Ospite non trovato';
    document.getElementById('guest-id').textContent = p.id || p.tel;
    document.getElementById('detail-phone').textContent = p.tel || '—';
    document.getElementById('detail-piva').textContent = p.piva || '—';
    document.getElementById('detail-date').textContent = '—';
    document.getElementById('checkin-time-row').style.display = 'none';

    const tag = document.getElementById('status-tag');
    tag.className = 'guest-status-tag';
    tag.style.background = '#1f0a0a';
    tag.style.border = '1px solid #5a1a1a';
    tag.style.color = '#ff4757';
    document.getElementById('status-label').textContent = 'Non registrato';

    const btn = document.getElementById('btn-checkin');
    btn.disabled = true;
    btn.className = 'btn-checkin';
    btn.textContent = '✗ Nessun ospite trovato';
  }

  // ─── RENDER GUEST ────────────────────────────────────────────────
  function renderGuest(data) {
    currentGuest = data;
    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('guest-card').classList.add('visible');

    document.getElementById('guest-name').textContent = data.nome;
    document.getElementById('guest-id').textContent = data.id;
    document.getElementById('detail-phone').textContent = data.telefono || '—';
    document.getElementById('detail-piva').textContent = data.piva || '—';
    document.getElementById('detail-date').textContent = data.dataConferma || '—';

    const tag = document.getElementById('status-tag');
    tag.removeAttribute('style');
    const label = document.getElementById('status-label');
    const btn = document.getElementById('btn-checkin');
    const checkinRow = document.getElementById('checkin-time-row');

    if (String(data.stato).includes('Arrivato')) {
      tag.className = 'guest-status-tag tag-done';
      label.textContent = 'Già registrato';
      btn.disabled = true;
      btn.className = 'btn-checkin done-state';
      btn.textContent = '✅ Check-in già effettuato';
      if (data.checkinTime) {
        document.getElementById('detail-checkin-time').textContent = data.checkinTime;
        checkinRow.style.display = 'flex';
      } else {
        checkinRow.style.display = 'none';
      }
    } else {
      tag.className = 'guest-status-tag tag-waiting';
      label.textContent = 'In attesa';
      btn.disabled = false;
      btn.className = 'btn-checkin';
      btn.textContent = '✓ Conferma ingresso';
      checkinRow.style.display = 'none';
    }
  }

  // ─── CHECK-IN ────────────────────────────────────────────────────
  async function doCheckIn() {
    if (!currentGuest || busy) return;
    const guest = currentGuest;
    const btn = document.getElementById('btn-checkin');
    btn.textContent = '⏳ Registrazione…';
    btn.disabled = true;
    busy = true;

    try {
      let res;
      if (DEMO_MODE) {
        res = { success: true, checkinTime: new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }) };
      } else {
        res = await api({ action: 'checkin', id: guest.id });
      }

      if (!res.success) {
        if (res.alreadyCheckedIn) {
          showToast('⚠️ Check-in già effettuato' + (res.checkinTime ? ' alle ' + res.checkinTime : ''), 'error');
          btn.className = 'btn-checkin done-state';
          btn.textContent = '✅ Check-in già effettuato';
        } else {
          showToast('❌ Check-in non registrato: riprova', 'error');
          btn.disabled = false;
          btn.textContent = '✓ Conferma ingresso';
        }
        return;
      }

      const timeStr = res.checkinTime;
      checkinCount++;
      document.getElementById('counter').textContent = checkinCount + ' ingressi';
      document.getElementById('status-tag').className = 'guest-status-tag tag-done';
      document.getElementById('status-label').textContent = 'Arrivato';
      btn.className = 'btn-checkin done-state pulse';
      btn.textContent = '✅ Check-in effettuato';
      document.getElementById('detail-checkin-time').textContent = timeStr;
      document.getElementById('checkin-time-row').style.display = 'flex';

      showToast('✅ ' + guest.nome + ' — ingresso alle ' + timeStr, 'success');
      addToLog(guest.nome, timeStr);
      currentGuest = null;
    } catch (e) {
      showToast('⚠️ Check-in NON registrato. ' + errMsg(e), 'error');
      btn.disabled = false;
      btn.textContent = '✓ Conferma ingresso';
    } finally {
      busy = false;
    }
  }

  // ─── LOG ─────────────────────────────────────────────────────────
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function addToLog(nome, time) {
    recentLog.unshift({ nome, time });
    if (recentLog.length > 5) recentLog.pop();
    document.getElementById('recent-log').classList.add('has-items');
    document.getElementById('log-list').innerHTML = recentLog.map(e =>
      '<div class="log-item"><span class="log-name">✓ ' + esc(e.nome) + '</span><span class="log-time">' + esc(e.time) + '</span></div>'
    ).join('');
  }

  // ─── TOAST ───────────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + (type || 'success') + ' show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.className = 'toast', type === 'error' ? 8000 : 3500);
  }

  document.getElementById('manual-id').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleScan(e.target.value.trim());
  });
</script>
</body>
</html>
